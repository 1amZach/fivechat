<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>fivechat</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="chat faded" id="chat">
        <nav class="tabs" id="tabs"></nav>
        <div class="feed" id="feed"><div class="rows" id="rows"></div></div>
        <div class="entry">
            <span class="mode" id="mode">Local</span>
            <input id="input" type="text" autocomplete="off" spellcheck="false" />
            <span class="count" id="count"></span>
        </div>
        <ul class="suggest" id="suggest" hidden></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
